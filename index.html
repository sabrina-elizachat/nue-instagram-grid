<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>nue · grid versions</title>
<link rel="icon" href="assets/nue-logo-gradient.png">
<style>
:root{--void:#0B0910;--elev:#131019;--line:#2A2434;--soft:#F9F9F9;--md:#9C97A8;--teal:#31BFBF;--lav:#C6B6F2}
*{box-sizing:border-box;margin:0}
body{background:var(--void);font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
a{color:var(--teal);text-decoration:none}a:hover{color:var(--lav)}
header{display:flex;align-items:center;gap:20px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--elev);flex:none;flex-wrap:wrap}
header img{height:20px;display:block}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-family:'Outfit',Helvetica,Arial,sans-serif;font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--md);background:none;border:1px solid transparent;border-radius:8px;padding:8px 14px;cursor:pointer}
.tab:hover{color:var(--soft)}
.tab.on{color:var(--soft);border-color:var(--line);background:var(--void)}
.tab small{display:block;font-weight:400;font-size:9.5px;color:var(--md);letter-spacing:.02em;margin-top:2px}
main{flex:1;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--void);display:none}
iframe.on{display:block}
</style></head>
<body>
<header>
<img src="assets/nue-logo-gradient.png" alt="nue">
<nav class="tabs">
<button class="tab" data-v="v3">V3<small>editorial dusk</small></button>
<button class="tab" data-v="v4">V4<small>more sky photography</small></button>
<button class="tab" data-v="v5">V5<small>quiet luxury type</small></button>
<button class="tab" data-v="v6">V6<small>dusk grid</small></button>
<button class="tab" data-v="v7">V7<small>minimal editorial</small></button>
<button class="tab" data-v="v8">V8<small>vitality still-life</small></button>
<button class="tab" data-v="v9">V9<small>best of 3 &middot; 6 &middot; 7</small></button>
<button class="tab on" data-v="v10">V10<small>warm quiet</small></button>
</nav>
</header>
<main>
<iframe data-v="v3" title="Grid v3" loading="lazy" src="v3.html"></iframe>
<iframe data-v="v4" title="Grid v4" loading="lazy" src="v4.html"></iframe>
<iframe data-v="v5" title="Grid v5" loading="lazy" src="v5.html"></iframe>
<iframe data-v="v6" title="Grid v6" loading="lazy" src="v6.html"></iframe>
<iframe data-v="v7" title="Grid v7" loading="lazy" src="v7.html"></iframe>
<iframe data-v="v8" title="Grid v8" loading="lazy" src="v8.html"></iframe>
<iframe data-v="v9" title="Grid v9" loading="lazy" src="v9.html"></iframe>
<iframe data-v="v10" title="Grid v10" loading="lazy" src="v10.html" class="on"></iframe>
</main>
<script>
const key='nue-grid-version-tab';
function pick(v){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));document.querySelectorAll('iframe').forEach(f=>f.classList.toggle('on',f.dataset.v===v));try{localStorage.setItem(key,v)}catch(e){}}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>pick(t.dataset.v)));
try{const s=localStorage.getItem(key);if(s&&document.querySelector('.tab[data-v="'+s+'"]'))pick(s)}catch(e){}
</script>
</body></html>
